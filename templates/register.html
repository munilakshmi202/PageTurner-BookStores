{% extends "base.html" %}

{% block title %}Register | PageTurner Books{% endblock %}

{% block content %}

<section class="page-section">
    <div class="container">

        <div class="login-card" style="max-width: 480px; margin: 0 auto; padding: 35px;">

            <div style="text-align: center; margin-bottom: 28px;">
                <p class="eyebrow dark">JOIN PAGETURNER</p>
                <h1>Create Account</h1>
                <p style="color: #64748b; margin-top: 8px;">
                    Create your account and start exploring our books.
                </p>
            </div>

            <form action="{{ url_for('register') }}" method="post">

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                        autocomplete="name"
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                        autocomplete="email"
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                        minlength="6"
                        autocomplete="new-password"
                    >
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Confirm your password"
                        required
                        minlength="6"
                        autocomplete="new-password"
                    >
                </div>

                <button
                    type="submit"
                    class="btn btn-primary"
                    style="width: 100%; margin-top: 10px;"
                >
                    Create Account
                </button>

            </form>

            <div style="text-align: center; margin-top: 22px; color: #64748b;">
                <p>
                    Already have an account?
                    <a
                        href="{{ url_for('login') }}"
                        style="color: #4f46e5; font-weight: 700;"
                    >
                        Login
                    </a>
                </p>
            </div>

        </div>

    </div>
</section>

{% endblock %}
