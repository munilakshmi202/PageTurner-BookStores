{% extends "base.html" %}

{% block title %}Login | PageTurner Books{% endblock %}

{% block content %}

<section class="page-section">

    <div class="container">

        <div class="login-card" style="max-width: 480px; margin: 0 auto; padding: 35px;">

            <div style="text-align: center; margin-bottom: 28px;">

                <p class="eyebrow dark">
                    WELCOME BACK
                </p>

                <h1>
                    Login
                </h1>

                <p style="color: #64748b; margin-top: 8px;">
                    Login to your PageTurner Books account.
                </p>

            </div>

            <form
                action="{{ url_for('login') }}"
                method="post"
            >

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                        autocomplete="email"
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password"
                    >

                </div>

                <button
                    type="submit"
                    class="btn btn-primary"
                    style="width: 100%; margin-top: 10px;"
                >
                    Login
                </button>

            </form>

            <div
                style="text-align: center; margin-top: 22px; color: #64748b;"
            >

                <p>
                    Don't have an account?

                    <a
                        href="{{ url_for('register') }}"
                        style="color: #4f46e5; font-weight: 700;"
                    >
                        Create Account
                    </a>
                </p>

            </div>

        </div>

    </div>

</section>

{% endblock %}
